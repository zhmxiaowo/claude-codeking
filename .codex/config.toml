[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,get_code_context_exa,crawling_exa"

[mcp_servers.fetch]
args = ["mcp-server-fetch"]
command = "uvx"

[mcp_servers.fetch.env]
